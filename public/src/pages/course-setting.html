<section id="course-setting-page" class="page-section">

  <!-- FILTER -->
  <section class="panel">
    <div class="filter-row course-setting-filter-row">
      <label>Tìm kiếm:</label>
      <input id="settingSearch" type="text" placeholder="Nhập tên / mã học phần.."/>

      <label>Loại học phần:</label>
      <select id="settingCourseType">
        <option value="ALL">Tất cả</option>
        <option value="OPTIONAL">Tự chọn</option>
        <option value="BASE">Cơ sở</option>
        <option value="FORCE">Bắt buộc</option>
      </select>
      <button class="btn btn-blue" id="addCourseBtn">Thêm mới học phần</button>
    </div>
  </section>

  <div class="split-layout">

    <!-- UPDATE FORM -->
    <section class="panel form-panel">
      <div class="section-title">Thông tin học phần</div>

      <div class="form-group">
        <label>Mã học phần:</label>
        <input id="courseCodeInput" type="text" />
      </div>

      <div class="form-group">
        <label>Tên học phần:</label>
        <input id="courseNameInput" type="text" />
      </div>

      <div class="form-group">
        <label>Số tín chỉ:</label>
        <input id="courseCreditInput" type="number" />
      </div>

      <div class="form-group">
        <label>Loại học phần:</label>
        <select id="courseTypeInput">
          <option value="OPTIONAL">Tự chọn</option>
          <option value="BASE">Cơ sở</option>
          <option value="FORCE">Bắt buộc</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn btn-green" id="updateCourseBtn">Cập nhật</button>
        <button class="btn btn-red" id="deleteCourseBtn">Xóa</button>
        <button class="btn btn-light" id="resetCourseBtn">Làm mới</button>
      </div>
    </section>

    <!-- TABLE -->
    <section class="panel table-panel">
      <div class="section-title">Danh sách học phần</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mã</th>
              <th>Tên</th>
              <th>Tín chỉ</th>
              <th>Loại</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="settingCourseTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- MODAL ADD -->
<div id="addCourseModal" class="modal hidden">
  <div class="modal-content">
    <h3>Thêm học phần</h3>

    <div class="form-group">
      <label>Mã học phần</label>
      <input id="add_code" placeholder="Nhập mã học phần">
    </div>

    <div class="form-group">
      <label>Tên học phần</label>
      <input id="add_name" placeholder="Nhập tên học phần">
    </div>

    <div class="form-group">
      <label>Số tín chỉ</label>
      <input id="add_credit" type="number" min="1" max="10" placeholder="1 - 10">
    </div>

    <div class="form-group">
      <label>Loại học phần</label>
      <select id="add_type">
        <option value="OPTIONAL">Tự chọn</option>
        <option value="BASE">Cơ sở</option>
        <option value="FORCE">Bắt buộc</option>
      </select>
    </div>

    <div class="form-group">
      <label>Thời gian mở</label>
      <input id="add_start" type="datetime-local">
    </div>

    <div class="form-group">
      <label>Thời gian đóng</label>
      <input id="add_end" type="datetime-local">
    </div>

    <div class="modal-actions">
      <button id="submitAddCourse" class="btn btn-green">Lưu</button>
      <button id="closeModal" class="btn btn-light">Hủy</button>
    </div>
  </div>
</div>

</section>
