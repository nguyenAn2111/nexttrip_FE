<section class="page-section">

  <!-- FILTER -->
  <section class="panel">
    <div class="filter-row course-filter-row">

      <label>Học kỳ:</label>
      <select id="semester">
        <option selected>2025.2</option>
        <option>2025.1</option>
      </select>

      <label>Tìm kiếm:</label>
      <input id="search" type="text" placeholder="Nhập tên học phần..." />

      <label>Trạng thái:</label>
      <select id="status">
        <option selected>Tất cả</option>
        <option>Đang mở</option>
        <option>Đóng</option>
      </select>

      <div class="actions">
        <button class="btn btn-green" id="openAllBtn">Mở tất cả</button>
        <button class="btn btn-red" id="closeAllBtn">Đóng tất cả</button>
      </div>

    </div>
  </section>

  <!-- TABLE -->
  <section class="panel">
    <div class="section-title">Danh sách học phần mở trong kỳ</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Mã học phần</th>
            <th>Tên học phần</th>
            <th>Loại</th>
            <th>Thời gian mở</th>
            <th>Trạng thái</th>
            <th>Số lượng đăng ký</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody id="courseTableBody"></tbody>

      </table>
    </div>
  </section>

</section>
