<section id="course-approval-page" class="page-section">

  <!-- FILTER -->
  <section class="panel">
    <div class="filter-row approval-filter-row">
      <label for="approvalSemester">Học kỳ:</label>
      <select id="approvalSemester">
        <option value="ALL" selected>Tất cả</option>
        <option value="2025.2">2025.2</option>
        <option value="2025.1">2025.1</option>
      </select>

      <label for="approvalSearch">Tìm kiếm:</label>
      <input id="approvalSearch" type="text" placeholder="Nhập tên SV / học phần..." />
      
      <label for="approvalStatus">Trạng thái:</label>
      <select id="approvalStatus">
        <option value="ALL" selected>Tất cả</option>
        <option value="PENDING">Chờ duyệt</option>
        <option value="APPROVED">Đã duyệt</option>
        <option value="REJECTED">Từ chối</option>
      </select>


      <label for="approvalFaculty">Khoa/Viện:</label>
      <select id="approvalFaculty">
        <option value="ALL" selected>Tất cả</option>
        <option value="CNTT">CNTT</option>
        <option value="DIEN">Điện</option>
        <option value="CK">Cơ khí</option>
        <option value="DTVT">DTVT</option>
      </select>

      <div class="actions">
        <button class="btn btn-blue" id="createRegBtn">Tạo đăng ký</button>
        <button class="btn btn-green" id="approveAllBtn">Duyệt tất cả</button>
        <button class="btn btn-red" id="rejectAllBtn">Từ chối tất cả</button>
      </div>

    </div>
  </section>

  <!-- TABLE -->
  <section class="panel">
    <div class="section-title">Danh sách đăng ký học phần của sinh viên</div>

    <div class="table-wrap approval-table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 140px;">Mã đăng ký</th>
            <th style="width: 200px;">Tên sinh viên</th>
            <th style="width: 140px;">Mã SV</th>
            <th style="width: 160px;">Khoa/Viện</th>
            <th style="width: 140px;">Mã học phần</th>
            <th>Tên học phần</th>
            <th style="width: 140px;">Trạng thái</th>
            <th style="width: 200px;">Hành động</th>
          </tr>
        </thead>

        <tbody id="approvalTableBody">
            <script src="./assets/js/pages/course-approval.js"></script>
        </tbody>

      </table>
    </div>
  </section>

  <!-- MODAL CREATE REG -->
<div id="createRegModal" class="modal hidden">
  <div class="modal-content">
    <h3>Tạo đăng ký học phần</h3>

    <div class="form-group">
      <label>Mã sinh viên</label>
      <input id="reg_student_code" placeholder="Nhập mã SV">
    </div>

    <div class="form-group">
      <label>Mã học phần</label>
      <input id="reg_course_code" placeholder="Nhập mã học phần">
    </div>

    <div class="modal-actions">
      <button id="submitCreateReg" class="btn btn-green">Lưu</button>
      <button id="closeCreateRegModal" class="btn btn-light">Hủy</button>
    </div>
  </div>
</div>

</section>
